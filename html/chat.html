<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Enable Web App Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Set the status bar style (black-translucent is most common) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- App Title for Home Screen -->
  <meta name="apple-mobile-web-app-title" content="OpenChat Mobile">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/openchat.jpeg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="../assets/images/openchat.jpeg">

  <title>OpenChat</title>

  <!-- CSS Links -->
  <link rel="stylesheet" href="../css/chat.css" />
  <link rel="stylesheet" href="../css/sidebar1.css">
  <link rel="stylesheet" href="../css/profileModal.css">
</head>

<body>
  <header>
    <h3 id="welcome-msg">Loading...</h3>

    <div class="left-aligned">
      <button id="rulesBtn" class="headerBtn">Rules</button>
      <button id="logoutBtn" class="headerBtn">Logout</button>
    </div>
  </header>

  <div id="chat-section">
    <aside id="sidebar1">
      <button class="sidebar1-link" id="new_chat_btn" style="color: #fff; font-size: 24px;">&plus;</button>
      <button class="sidebar1-link" id="dms_button">DM's</button>
      <button id="main-chat" class="active"><a href="chat.html" class="sidebar1-link">Main Chat :D</a></button>
    </aside>
    <aside id="sidebar">
      <h2>Channels</h2>

      <ul id="channel-list"></ul>    <!-- This <li> element list gets changed to the names of the users for dms. When a DM is clicked it displays everything in the main chat window. -->

      <!-- Profile Modal -->
      <div id="profile-modal" class="profile-modal">
        <div class="profile-modal-content">
          <span id="close-profile-modal">&times;</span>
          <img id="modal-avatar" src="../assets/images/default-avatar.png" alt="Avatar">
          <h2 id="modal-username">Loading...</h2>
          <p id="modal-status" class="user-status" style="color: #00ff00 !important;">Online</p>

          <!-- Edit section -->
          <button id="editName">Edit Display Name</button>
          <div id="editNameForm" class="edit-name-form">
            <input type="text" id="newDisplayName" placeholder="Enter new display name">
            <div class="edit-buttons">
              <button id="saveName">Save</button>
              <button id="cancelEdit">Cancel</button>
            </div>
          </div>

          <p id="modal-description">No description yet.</p>
        </div>
      </div>

      <style>
        
      </style>
      <div id="profile">
        <img src="../assets/images/default-avatar.png" alt="My Avatar" />
        <div class="profile-info">
          <span id="profile-username">Loading...</span>
          <span class="profile-status">Online</span>
        </div>
      </div>
    </aside>

    <main id="chat-window">
      <ul id="messages"></ul>

      <form id="message-form">
        <label for="image-input" id="upload-image-btn">+</label>
        <input type="file" id="image-input" accept="image/*" style="display: none;" />

        <input type="text" id="message-input" placeholder="Message @Faith Chat" autocomplete="off" required />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/master.js"></script>
  <script type="module" src="../js/button.js"></script>
  <script src="../js/mobile/mobile.js"></script>
</body>

</html>
