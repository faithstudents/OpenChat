<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenChat - DMs</title>
    <link rel="stylesheet" href="../css/dms.css" />
</head>
<body>
<header>
    <h1>OpenChat DMs</h1>
    <nav>
        <button id="back-to-chat">Back to Faith Chat</button>
        <button id="logout-btn">Logout</button>
    </nav>
</header>

<div id="chat-section">
    <!-- Sidebar -->
    <aside id="sidebar">
        <h2>Users</h2>
        <ul id="user-list"></ul>

        <div id="profile">
            <img src="../assets/images/default-avatar.png" alt="My Avatar" />
            <div class="profile-info">
                <span>Patrick</span>
                <span class="profile-status">Online</span>
            </div>
        </div>
    </aside>

    <!-- Chat Window -->
    <main id="chat-window">
        <ul id="messages"></ul>

        <!-- Message form -->
        <form id="message-form">
            <label for="image-input" id="upload-image-btn">+</label>
            <input type="file" id="image-input" accept="image/*" style="display:none;" />
            <input
                    type="text"
                    id="message-input"
                    placeholder="Message @Alice"
                    autocomplete="off"
                    required
            />
            <button type="submit">Send</button>
        </form>
    </main>
</div>

<script type="module" src="../js/dms.js"></script>
</body>
</html>
